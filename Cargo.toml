[package]
name = "rust-playground"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
diesel = { version = "2.3.9", features = ["postgres", "uuid", "chrono", "r2d2"] }
dotenvy = "0.15.7"
paseto-v4 = "0.1.0-rc.8"
paseto-json = "0.1.0-rc.8"
argon2 = "0.5.3"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
hex = "0.4.3"
chrono = { version = "0.4.44", features = ["serde"] }
rand = "0.8"
futures-util = "0.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
url = "2"
ed25519-dalek = "2"
actix-multipart = "0.7"
base64 = "0.22"
