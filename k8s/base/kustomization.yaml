# Environment-agnostic manifests for mtmulch.com.
# Overlays (k8s/overlays/<env>) add the backing services, secrets and
# environment-specific config on top of this.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - api.yaml
  - web.yaml
  - migrate-job.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: mtmulch
    includeSelectors: false
