# Same-origin routing, matching production: /api -> Rust API, everything else -> SPA.
# Serving both from one origin means no CORS is needed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mtmulch
spec:
  rules:
    - host: HOST_PLACEHOLDER # set by each overlay
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
