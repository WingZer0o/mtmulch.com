# Azurite blob emulator, standing in for Azure Blob Storage locally.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: azurite-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: azurite
  labels:
    app.kubernetes.io/name: azurite
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO volume can't be shared during a rolling update
  selector:
    matchLabels:
      app.kubernetes.io/name: azurite
  template:
    metadata:
      labels:
        app.kubernetes.io/name: azurite
    spec:
      containers:
        - name: azurite
          image: mcr.microsoft.com/azure-storage/azurite:latest
          command:
            - azurite-blob
            - --blobHost
            - 0.0.0.0
            - --location
            - /data
            - --skipApiVersionCheck
          ports:
            - name: blob
              containerPort: 10000
          readinessProbe:
            tcpSocket:
              port: blob
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: azurite-data
---
apiVersion: v1
kind: Service
metadata:
  name: azurite
  labels:
    app.kubernetes.io/name: azurite
spec:
  selector:
    app.kubernetes.io/name: azurite
  ports:
    - name: blob
      port: 10000
      targetPort: blob
