# Builds the container images for the home-lab cluster and pushes them to GHCR.
# Flux (clusters/homelab/image-automation.yaml) watches GHCR, picks the newest tag
# for its branch and commits it to k8s/overlays/homelab — so this workflow never
# needs access to the home network or the cluster.
#
# Tags look like  <branch>-<short sha>-<unix time>,  e.g. homelab-flux-1a2b3c4-1795300000
name: Home-lab images

on:
  push:
    branches: [main, homelab-flux]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "diesel.toml"
      - "migrations/**"
      - "frontend/**"
      - "k8s/migrate.Dockerfile"
      - ".github/workflows/homelab-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: homelab-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      owner: ${{ steps.tag.outputs.owner }}
    steps:
      - id: tag
        run: |
          branch="${GITHUB_REF_NAME//\//-}"
          echo "tag=${branch}-${GITHUB_SHA::7}-$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mtmulch-api
            context: .
            file: Dockerfile
          - image: mtmulch-web
            context: frontend
            file: frontend/Dockerfile
          - image: mtmulch-migrate
            context: .
            file: k8s/migrate.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/${{ needs.tag.outputs.owner }}/${{ matrix.image }}:${{ needs.tag.outputs.tag }}
          # Links the package to this repo on GitHub.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
