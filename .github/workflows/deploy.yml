name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"
      - "migrations/**"

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: ${{ secrets.ACR_NAME }}.azurecr.io
  IMAGE: rust-playground
  RESOURCE_GROUP: Rust-Playground
  CONTAINER_APP: rust-playground

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            migrations:
              - 'migrations/**'
              - '.github/workflows/deploy.yml'
            code:
              - 'src/**'
              - 'Cargo.toml'
              - 'Dockerfile'
              - '.github/workflows/deploy.yml'

  migrate:
    needs: filter
    if: needs.filter.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Azure AD token and service principal name for PostgreSQL
        id: db-token
        run: |
          TOKEN=$(az account get-access-token --resource-type oss-rdbms --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          SP_NAME=$(az ad sp show --id ${{ secrets.AZURE_CLIENT_ID }} --query displayName -o tsv)
          echo "sp_name=$SP_NAME" >> $GITHUB_OUTPUT

      - name: Add runner IP to PostgreSQL firewall
        id: firewall
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          az postgres flexible-server firewall-rule create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name rust-playground \
            --rule-name github-actions-runner \
            --start-ip-address $RUNNER_IP \
            --end-ip-address $RUNNER_IP

      - name: Install libpq
        run: sudo apt-get install -y libpq-dev

      - name: Install diesel_cli
        run: cargo install diesel_cli --no-default-features --features postgres

      - name: Run migrations
        env:
          DATABASE_URL: postgres://${{ steps.db-token.outputs.sp_name }}:${{ steps.db-token.outputs.token }}@rust-playground.postgres.database.azure.com:5432/rust_playground?sslmode=require
        run: diesel migration run

      - name: Remove runner IP from PostgreSQL firewall
        if: always()
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name rust-playground \
            --rule-name github-actions-runner \
            --yes

  build-and-deploy:
    needs: [filter, migrate]
    if: |
      always() &&
      needs.filter.outputs.code == 'true' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry ${{ secrets.ACR_NAME }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --image ${{ env.IMAGE }}:latest \
            .

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
